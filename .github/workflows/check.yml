name: Check Remote Structure
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app status
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass -q
          sshpass -e ssh -o StrictHostKeyChecking=no -p 65002 u502587017@191.101.230.15 "
            cd ~/domains/erp.jbmpschool.in
            echo '=== nodejs/ dir ===' && find nodejs -maxdepth 4 2>/dev/null
            echo '=== hbuilds/ dir ===' && find hbuilds -maxdepth 3 2>/dev/null
            echo '=== find npm anywhere under app ===' && find . -maxdepth 6 -iname 'npm' 2>/dev/null
            NPMBIN=\$(find . -maxdepth 6 -iname 'npm' -type f 2>/dev/null | head -1)
            if [ -n \"\$NPMBIN\" ]; then
              echo \"=== found npm at \$NPMBIN, installing web-push ===\"
              \$NPMBIN install --production 2>&1 | tail -40
              echo '=== web-push installed? ===' && ls node_modules/web-push 2>/dev/null && echo OK || echo STILL_MISSING
            else
              echo 'NO NPM BINARY FOUND UNDER APP DIR'
            fi
          "
