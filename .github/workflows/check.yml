name: Check Remote Structure
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app status
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass -q
          sshpass -e ssh -o StrictHostKeyChecking=no -p 65002 u502587017@191.101.230.15 "
            echo '=== nodevenv dirs ===' && ls -la ~/nodevenv 2>/dev/null || echo 'no ~/nodevenv'
            echo '=== find npm binaries ===' && find ~ -maxdepth 6 -iname 'npm' -type f 2>/dev/null
            echo '=== app root listing ===' && ls -la ~/domains/erp.jbmpschool.in/ | head -30
          "
