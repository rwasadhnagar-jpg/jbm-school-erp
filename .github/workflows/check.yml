name: Check Remote Structure
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app status
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass -q
          sshpass -e ssh -o StrictHostKeyChecking=no -p 65002 u502587017@191.101.230.15 "
            echo '=== nodejs/ dir ===' && find ~/domains/erp.jbmpschool.in/nodejs -maxdepth 4 2>/dev/null
            echo '=== hbuilds/ dir ===' && find ~/domains/erp.jbmpschool.in/hbuilds -maxdepth 3 2>/dev/null
            echo '=== public_html/ dir ===' && ls -la ~/domains/erp.jbmpschool.in/public_html 2>/dev/null
            echo '=== find npm anywhere under domains ===' && find ~/domains/erp.jbmpschool.in -maxdepth 6 -iname 'npm' 2>/dev/null
          "
