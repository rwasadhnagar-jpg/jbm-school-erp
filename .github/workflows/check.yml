name: Check Remote Structure
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app status
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass -q
          sshpass -e ssh -o StrictHostKeyChecking=no -p 65002 u502587017@191.101.230.15 "
            cd ~/domains/erp.jbmpschool.in
            echo '=== successful deploy log (2026-05-29) ===' && cat hbuilds/logs/019e7513-8293-734e-ab04-89442b8bf93b/2026-05-29_18-51-33_deploy.log 2>/dev/null
            echo '=== failed redeploy log (2026-08-31) ===' && cat hbuilds/logs/01a05918-e0cd-7017-a802-ab789127e091/2026-08-31_18-34-24_deploy.log 2>/dev/null
            echo '=== nodejs/bin listing ===' && ls -la nodejs/bin 2>/dev/null || echo 'no nodejs/bin'
            echo '=== nodejs top-level listing ===' && ls -la nodejs 2>/dev/null
          "
