name: Check Remote Structure
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check app status
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass -q
          sshpass -e ssh -o StrictHostKeyChecking=no -p 65002 u502587017@191.101.230.15 "
            echo '=== login shell npm/node resolution ===' && bash --login -c 'which npm; which node; npm --version' 2>&1
            echo '=== nodejs/.env (current live env) ===' && cat ~/domains/erp.jbmpschool.in/nodejs/.env 2>/dev/null
            echo '=== nodejs/package.json scripts ===' && grep -A2 scripts ~/domains/erp.jbmpschool.in/nodejs/package.json 2>/dev/null
            echo '=== nodejs/server-err.log (tail) ===' && tail -30 ~/domains/erp.jbmpschool.in/nodejs/server-err.log 2>/dev/null
          "
